name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand active event page images
        if: github.event_name != 'pull_request' && vars.PAGE_IMAGES_ENDPOINT != ''
        env:
          PAGE_IMAGES_ENDPOINT: ${{ vars.PAGE_IMAGES_ENDPOINT }}
          PAGE_DEPLOY_SECRET: ${{ secrets.PAGE_DEPLOY_SECRET }}
        run: |
          PAGE_ARCHIVE_URL=$(curl --fail --silent --show-error \
            --header "X-Deploy-Secret: $PAGE_DEPLOY_SECRET" \
            "$PAGE_IMAGES_ENDPOINT" | jq -r '.signedUrl')
          test -n "$PAGE_ARCHIVE_URL"
          test "$PAGE_ARCHIVE_URL" != "null"
          curl --fail --silent --show-error --location "$PAGE_ARCHIVE_URL" --output /tmp/page-images.zip
          unzip -o /tmp/page-images.zip -d public
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
