name: Validate and deploy Supabase

on:
  pull_request:
    branches: [develop]
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "deno.lock"
      - "scripts/supabase-db-connection.mjs"
      - ".github/tests/supabase-db-connection.test.mjs"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate migrations and functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test deployment database connection setup
        run: node --test .github/tests/supabase-db-connection.test.mjs

      - name: Apply migrations to a fresh local database
        run: supabase db start

      - name: Lint local database
        run: supabase db lint --local --level warning --fail-on warning

      - name: Test participation history access
        run: supabase test db supabase/tests/submission_history.sql

      - name: Test event activation access
        run: supabase test db supabase/tests/event_activation.sql

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.4.5

      - name: Type-check Edge Functions
        run: deno check --frozen supabase/functions/create-user/index.ts supabase/functions/reset-user-password/index.ts supabase/functions/activate-event/index.ts supabase/functions/page-images-archive/index.ts

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check deployment configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_ID"

      - name: Configure IPv4 Session pooler connection
        run: node scripts/supabase-db-connection.mjs

      - name: Deploy database migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
