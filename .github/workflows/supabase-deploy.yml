name: Validate and deploy Supabase

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - "deno.lock"
      - ".github/workflows/supabase-deploy.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "deno.lock"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate migrations and functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Apply migrations to a fresh local database
        run: supabase db start

      - name: Lint local database
        run: supabase db lint --local --level warning --fail-on warning

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.4.5

      - name: Type-check Edge Functions
        run: deno check --frozen supabase/functions/create-user/index.ts supabase/functions/reset-user-password/index.ts

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Check deployment configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_ID"

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy database migrations
        run: supabase db push --linked

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
