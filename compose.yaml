services:
  web:
    build:
      context: .
    working_dir: /app
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html:ro
      - ./vite.config.ts:/app/vite.config.ts:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tsconfig.app.json:/app/tsconfig.app.json:ro
      - ./tsconfig.node.json:/app/tsconfig.node.json:ro
      - ./eslint.config.js:/app/eslint.config.js:ro
      - node_modules:/app/node_modules
      - build_output:/app/dist
      - supabase_runtime:/supabase-runtime:ro
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command:
      - /bin/sh
      - -ec
      - |
        set -a
        . /supabase-runtime/supabase.env
        set +a
        export VITE_SUPABASE_URL="$$API_URL"
        export VITE_SUPABASE_ANON_KEY="$$ANON_KEY"
        exec npm run dev -- --host 0.0.0.0

  backend:
    build:
      context: .
      dockerfile: Dockerfile.supabase
    init: true
    network_mode: host
    working_dir: /workspace
    volumes:
      - .:/workspace
      - ${DOCKER_HOST_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - supabase_runtime:/supabase-runtime
    command:
      - /bin/sh
      - -ec
      - |
        cleanup() {
          supabase stop || true
        }
        trap cleanup EXIT
        trap 'exit 0' INT TERM
        supabase start
        supabase status -o env > /supabase-runtime/supabase.env
        while sleep 5; do :; done
    healthcheck:
      test: ["CMD-SHELL", "test -s /supabase-runtime/supabase.env"]
      interval: 3s
      timeout: 2s
      retries: 60
      start_period: 10s
    stop_grace_period: 1m

volumes:
  node_modules:
  build_output:
  supabase_runtime:
